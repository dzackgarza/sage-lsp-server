[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-lsp"
version = "0.1.0"
description = "Sage-aware Language Server Protocol server for JupyterLab syntax intelligence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Local"}]
dependencies = [
  "pygls>=2.1",
  "lsprotocol>=2025.0.0"
]

[project.scripts]
sage-lsp = "sage_lsp.__main__:main"

[project.urls]
Homepage = "https://github.com/dzackgarza/local-tools"
