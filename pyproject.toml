[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-lsp"
version = "0.3.2"
description = "Sage-aware Language Server Protocol server for JupyterLab syntax intelligence"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Local"}]
dependencies = [
  "python-lsp-server>=1.14.0",
  "pyflakes",
  "pycodestyle",
  # The SagePython compiler ships with the grammar, tracked at git main.
  "tree-sitter",
  "tree-sitter-sage @ git+https://github.com/dzackgarza/tree-sitter-sage",
]

[project.scripts]
sage-lsp = "sage_lsp.__main__:main"

[project.entry-points.pylsp]
sage = "sage_lsp.server"

[project.urls]
Homepage = "https://github.com/dzackgarza/sage-lsp-server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_lsp = ["data/*.json"]
