[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-lsp"
version = "0.2.0"
description = "Sage-aware Language Server Protocol server for JupyterLab syntax intelligence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Local"}]
dependencies = [
  "python-lsp-server>=1.14.0",
  "pyflakes",
  "pycodestyle",
  # The SagePython compiler (sage-free core of the research preamble)
  # and its grammar, tracked at their git mains.
  "dzack-research-preamble @ git+https://github.com/dzackgarza/research#subdirectory=src/dzack_research/preamble",
  "tree-sitter",
  "tree-sitter-sage @ git+https://github.com/dzackgarza/tree-sitter-sage",
]

[project.scripts]
sage-lsp = "sage_lsp.__main__:main"

[project.entry-points.pylsp]
sage = "sage_lsp.server"

[project.urls]
Homepage = "https://github.com/dzackgarza/sage-lsp-server"
